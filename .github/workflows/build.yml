name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SourceAFIS.sln

      - name: Build
        run: dotnet build SourceAFIS.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test SourceAFIS.sln --configuration Release --no-build

      - name: Define CI package version
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        id: package-version
        shell: bash
        run: echo "value=3.14.0-rk.ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Package
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: >-
          dotnet pack SourceAFIS/SourceAFIS.csproj
          --configuration Release
          --no-build
          --output artifacts/packages
          -p:PackageVersion=${{ steps.package-version.outputs.value }}
          -p:ContinuousIntegrationBuild=true

      - name: Upload package artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: RogerioKoglin.SourceAFIS-${{ steps.package-version.outputs.value }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          retention-days: 14
