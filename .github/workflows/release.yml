name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão SemVer do pacote (ex.: 3.14.0-rk.1)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve and validate package version
        id: package-version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$REQUESTED_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Versão SemVer inválida: $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore SourceAFIS.sln

      - name: Build
        shell: bash
        env:
          SIXLABORS_LICENSE: ${{ secrets.SIXLABORS_LICENSE }}
          PACKAGE_VERSION: ${{ steps.package-version.outputs.value }}
        run: |
          set -euo pipefail
          : "${SIXLABORS_LICENSE:?Configure o secret SIXLABORS_LICENSE no GitHub}"

          license_file="$(mktemp "$RUNNER_TEMP/sixlabors.XXXXXX.lic")"
          trap 'rm -f -- "$license_file"' EXIT
          printf '%s' "$SIXLABORS_LICENSE" > "$license_file"
          unset SIXLABORS_LICENSE

          dotnet build SourceAFIS.sln \
            --configuration Release \
            --no-restore \
            -p:Version="$PACKAGE_VERSION" \
            -p:SixLaborsLicenseFile="$license_file"

      - name: Test
        run: dotnet test SourceAFIS.sln --configuration Release --no-build

      - name: Create release package
        run: >-
          dotnet pack SourceAFIS/SourceAFIS.csproj
          --configuration Release
          --no-build
          --output artifacts/packages
          -p:PackageVersion=${{ steps.package-version.outputs.value }}
          -p:ContinuousIntegrationBuild=true

      - name: Upload release package artifact
        uses: actions/upload-artifact@v4
        with:
          name: RogerioKoglin.SourceAFIS-${{ steps.package-version.outputs.value }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

      - name: Obter chave temporária do NuGet
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: RogerioKoglin

      - name: Publish to NuGet
        run: >-
          dotnet nuget push artifacts/packages/*.nupkg
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
