name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão SemVer do pacote (ex.: 3.14.0-rk.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve and validate package version
        id: package-version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$REQUESTED_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Versão SemVer inválida: $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore SourceAFIS.sln

      - name: Build
        run: >-
          dotnet build SourceAFIS.sln
          --configuration Release
          --no-restore
          -p:Version=${{ steps.package-version.outputs.value }}

      - name: Test
        run: dotnet test SourceAFIS.sln --configuration Release --no-build

      - name: Create release package
        run: >-
          dotnet pack SourceAFIS/SourceAFIS.csproj
          --configuration Release
          --no-build
          --output artifacts/packages
          -p:PackageVersion=${{ steps.package-version.outputs.value }}
          -p:ContinuousIntegrationBuild=true

      - name: Upload release package artifact
        uses: actions/upload-artifact@v4
        with:
          name: RogerioKoglin.SourceAFIS-${{ steps.package-version.outputs.value }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

      - name: Publish to NuGet
        env:
          NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$NUGET_TOKEN" ]]; then
            echo "Configure o secret NUGET_TOKEN antes de publicar." >&2
            exit 1
          fi
          dotnet nuget push artifacts/packages/*.nupkg \
            --api-key "$NUGET_TOKEN" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
